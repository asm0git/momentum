name: Build and deploy Momentum

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=1
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: momentum-web
          path: build/web
          if-no-files-found: error

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - run: npm run typecheck
        working-directory: worker

      - run: npm test
        working-directory: worker

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      ALLOWED_CANVAS_HOST: ${{ vars.ALLOWED_CANVAS_HOST }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: momentum-web
          path: build/web

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: Check deployment settings
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN under GitHub Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID under GitHub Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [[ ! "$APP_ORIGIN" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Set APP_ORIGIN to the HTTPS origin only, for example https://momentum.example.com."
            exit 1
          fi

      - name: Apply database updates
        run: npx wrangler d1 migrations apply momentum-canvas --remote
        working-directory: worker

      - name: Deploy app and API on one domain
        shell: bash
        run: |
          APP_HOST="${APP_ORIGIN#https://}"
          ARGS=(--domain "$APP_HOST" --var "APP_ORIGIN:$APP_ORIGIN")
          if [[ -n "$ALLOWED_CANVAS_HOST" ]]; then
            ARGS+=(--var "ALLOWED_CANVAS_HOST:$ALLOWED_CANVAS_HOST")
          fi
          npx wrangler deploy "${ARGS[@]}"
        working-directory: worker
